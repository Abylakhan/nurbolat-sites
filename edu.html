<head>

<meta name="robots" content="noindex">
<title>Demo Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Rubik:wght@500;700&display=swap">
<link rel="stylesheet" href="kit.css">
<style>
/* Учебный центр: белый фон, индиго и жёлтый маркер, округлые формы */
:root{--bg:#FFFFFF;--fg:#1B1F3B;--ac:#5B5BD6;--ai:#fff;--sf:#F2F2FD;--cd:#FFFFFF;--ln:#E0E1F3;--mu:#5C6185;--hf:'Rubik',system-ui,sans-serif;--bf:'Onest',system-ui,sans-serif;--hw:700;--ht:-.02em;--r:14px;--yl:#FFD45C}
.mark{background:linear-gradient(transparent 62%,var(--yl) 62%)}
.av{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--yl);font:700 1.2rem var(--hf)}
.slot{display:block;padding:6px 8px;margin:2px 0;border-radius:8px;background:var(--sf);color:var(--fg);font-size:.82rem;line-height:1.3;text-decoration:none}
.slot:hover{background:var(--ac);color:#fff}
.bar{height:8px;border-radius:4px;background:var(--sf);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.qopt{display:grid;gap:10px}
.lvl{display:grid;place-items:center;width:96px;height:96px;border-radius:50%;background:var(--yl);font:700 2rem var(--hf)}
</style>
</head>

  function grid() {
    var list = CRS.filter(function (c) { return st.sc === 'all' || c.id === st.sc; }), times = {};
    list.forEach(function (c) { c.sl.forEach(function (x) { times[x[1]] = 1; }); });
    return Object.keys(times).sort().map(function (t) {
      return '<tr><th class="num">' + t + '</th>' + DAYS.map(function (d, di) {
        return '<td>' + list.filter(function (c) { return c.sl.some(function (x) { return x[0] === di && x[1] === t; }); }).map(function (c) { return '<a class="slot" href="#/course/' + c.id + '">' + e(L(c.n)) + '</a>'; }).join('') + '</td>';
      }).join('') + '</tr>';
    }).join('');
  }

  var routes = {
    home: function () {
      return '<section class="hero"><div class="wrap"><div class="hero-c"><h1>' + e(s('h1a')) + ' <span class="mark">' + e(s('h1b')) + '</span></h1><p class="lead">' + e(s('hp')) + '</p><div class="row"><a class="btn" href="#/signup">' + e(s('trial')) + '</a><a class="btn gh" href="#/test">' + e(s('toTest')) + '</a></div></div>' + K.ph('1509062522246-3755977927d7', '4/3', s('courses')) + '</div></section>' +
        '<section class="band"><div class="wrap"><div class="g" style="--min:300px">' + [1, 2, 3].map(function (i) { return '<div class="card"><h3>' + e(s('f' + i)) + '</h3><p class="mu">' + e(s('f' + i + 'd')) + '</p></div>'; }).join('') + '</div></div></section>' +
        '<section><div class="wrap"><div class="hd"><h2>' + e(s('pop')) + '</h2></div><div class="g" style="--min:230px">' + ['en-teens', 'ielts', 'ent', 'python'].map(function (id) { return ccard(crs(id)); }).join('') + '</div><p style="margin-top:24px"><a class="btn gh" href="#/courses">' + e(s('allC')) + '</a></p></div></section>' +
        '<section class="band"><div class="wrap"><div class="hd"><h2>' + e(s('team')) + '</h2></div><div class="g" style="--min:300px">' + TCH.map(function (t) { return '<div class="card"><div class="who"><div class="av">' + L(t[0]).charAt(0) + '</div><div><h3>' + e(L(t[0])) + '</h3><p class="mu sm">' + e(s(t[1])) + '</p></div></div><p class="mu sm">' + s('exp', { n: t[2] }) + '</p></div>'; }).join('') + '</div></div></section>' +
        '<section><div class="wrap g2"><div class="hd"><h2>' + e(s('faq')) + '</h2></div><div>' + [1, 2, 3].map(function (i) { return '<details' + (i === 1 ? ' open' : '') + '><summary>' + e(s('q' + i)) + '</summary><p>' + e(s('q' + i + 'a')) + '</p></details>'; }).join('') + '</div></div></section>';
    },
    courses: function () {
      var a = CRS.filter(function (c) { return (st.ag === 'all' || c.ag === st.ag) && (st.sj === 'all' || c.sj === st.sj); });
      return '<section class="pg"><div class="wrap"><div class="hd"><h1>' + e(s('courses')) + '</h1></div><div class="f" style="margin-bottom:24px"><div class="row"><span class="mu sm">' + e(s('age')) + '</span>' + chips('ag', ['kids', 'teens', 'adults']) + '</div><div class="row"><span class="mu sm">' + e(s('subj')) + '</span>' + chips('sj', ['en', 'ent', 'math', 'it']) + '</div></div>' + (a.length ? '<div class="g">' + a.map(ccard).join('') + '</div>' : '<div class="box"><p>' + e(s('noC')) + '</p></div>') + '</div></section>';
    },
    course: function (id) {
      var c = crs(id), t = TCH[c.t]; pick = c.id;
      return '<section class="pg"><div class="wrap"><div class="crumbs"><a href="#/courses">' + e(s('courses')) + '</a><span>/</span><span>' + e(L(c.n)) + '</span></div><div class="g2"><div class="f"><div class="row"><span class="tag on">' + e(s(c.sj)) + '</span><span class="tag">' + e(s(c.ag)) + '</span></div><h1 style="font-size:clamp(1.8rem,4vw,2.8rem)">' + e(L(c.n)) + '</h1><p class="lead">' + e(L(c.d)) + '</p><h2 style="margin-top:12px">' + e(s('prog')) + '</h2><ol class="g steps" style="--min:200px">' + PROG[c.sj].map(function (m) { return '<li><h3>' + e(L(m)) + '</h3></li>'; }).join('') + '</ol></div>' +
        '<div class="box sticky"><p class="big num">' + s('perMo', { p: K.money(c.p) }) + '</p><div class="list"><div><span>' + e(s('when')) + '</span><i></i><b>' + e(slots(c)) + '</b></div><div><span>' + e(s('length')) + '</span><i></i><b>' + s('dur', { n: c.m }) + '</b></div><div><span>' + e(s('group')) + '</span><i></i><b>' + e(s('upTo')) + '</b></div><div><span>' + e(s('teacher')) + '</span><i></i><b>' + e(L(t[0])) + '</b></div></div><a class="btn" href="#/signup">' + e(s('trial')) + '</a></div></div></div></section>';
    },
    schedule: function () {
      return '<section class="pg"><div class="wrap"><div class="hd"><h1>' + e(s('schedule')) + '</h1></div><div style="max-width:420px;margin-bottom:20px">' + K.fl(s('course'), '<select id="sc"><option value="all">' + e(s('allS')) + '</option>' + CRS.map(function (c) { return '<option value="' + c.id + '"' + (st.sc === c.id ? ' selected' : '') + '>' + e(L(c.n)) + '</option>'; }).join('') + '</select>') + '</div><div class="tw"><table style="min-width:720px"><thead><tr><th>' + e(s('timeC')) + '</th>' + DAYS.map(function (d) { return '<th>' + e(L(d)) + '</th>'; }).join('') + '</tr></thead><tbody id="grid">' + grid() + '</tbody></table></div></div></section>';
    },
    test: function () { return '<section class="pg"><div class="wrap" style="max-width:760px"><div class="hd"><h1>' + e(s('test')) + '</h1></div><div id="tbox">' + testHtml() + '</div></div></section>'; },
    signup: function () {
      return '<section class="pg"><div class="wrap g2"><div class="hd"><h1>' + e(s('sT')) + '</h1><p class="lead">' + e(s('sD')) + '</p>' + K.ph('1524178232363-1fb2b075b655', '16/10', s('courses')) + '</div><div class="box">' + signForm() + '</div></div></section>';
    }
  };

  function tUpd() { var b = K.q('#tbox'); if (b) b.innerHTML = testHtml(); }
  document.addEventListener('click', function (ev) {
    var b;
    if ((b = ev.target.closest('[data-flt]'))) { st[b.getAttribute('data-flt')] = b.getAttribute('data-v'); K.refresh(); return; }
    if ((b = ev.target.closest('[data-t]'))) {
      if (b.getAttribute('data-t') === 'start') tq = { i: 0, a: [] }; else if (tq.a[tq.i] != null) tq.i++;
      tUpd();
    }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.name === 'ans') { tq.a[tq.i] = +t.value; var n = K.q('[data-t=next]'); if (n) n.disabled = false; }
    else if (t.id === 'sc') { st.sc = t.value; K.q('#grid').innerHTML = grid(); }
  });

  K.init({
    brand: 'Demo <i>Academy</i>', niche: ['учебного центра', 'оқу орталығына', 'a training centre'], S: S,
    nav: [['courses', 'courses'], ['schedule', 'schedule'], ['test', 'test'], ['signup', 'signup']], cta: ['signup', 'trial'], routes: routes
  });
})();
</script>
</body>
</html>
