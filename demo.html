    var d = N[niche], u = UI[lang], i = IDX[lang], root = doc.documentElement;
    root.lang = CODES[lang];
    ['--bg','--fg','--ac','--soft'].forEach(function(v, k){ root.style.setProperty(v, d.c[k]); });
    doc.title = d.brand;
    $('brand').textContent = d.brand;
    ['bar','want','back','n1','n2','n3','sh','wh','fh','fs','ln','lp','send','foot','addr'].forEach(function(k){ $(k).textContent = u[k]; });
    $('h1').textContent = d.h[i]; $('sub').textContent = d.p[i]; $('cta').textContent = d.cta[i];
    $('chipName').textContent = d.s[1][i]; $('chipPrice').textContent = price(d.s[1]);
    $('prices').innerHTML = d.s.map(function(r){ return '<li><span>' + esc(r[i]) + '</span><i></i><b>' + esc(price(r)) + '</b></li>'; }).join('');
    $('whyList').innerHTML = d.w.map(function(r){ return '<li>' + esc(r[i]) + '</li>'; }).join('');
    $('want').href = 'https://wa.me/' + WA + '?text=' + encodeURIComponent(u.msg.replace('{niche}', d.wa[i]));
    $('sent').textContent = u.sent;
    [].forEach.call(doc.querySelectorAll('#lang button'), function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang)); });
    try { history.replaceState(null, '', '#' + niche + '-' + lang); } catch(e){}
  }

  $('lang').addEventListener('click', function(e){
    var l = e.target.getAttribute('data-lang');
    if (!CODES[l]) return;
    lang = l;
    try { localStorage.setItem('lang', l); } catch(err){}
    render();
  });
  $('lead').addEventListener('submit', function(e){ e.preventDefault(); $('sent').hidden = false; });
  window.addEventListener('hashchange', function(){
    var p = location.hash.replace('#', '').split('-');
    if (N[p[0]] && (p[0] !== niche || (CODES[p[1]] && p[1] !== lang))) { niche = p[0]; if (CODES[p[1]]) lang = p[1]; render(); }
  });
  render();
})();
</script>
</body>
</html>
