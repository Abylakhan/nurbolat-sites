<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Demo Auto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Oswald:wght@500;600&display=swap">
<link rel="stylesheet" href="kit.css">
<style>
/* Автосалон: тёмный шоурум, крупные заголовки, автомобили нарисованы в SVG */
:root{color-scheme:dark;--bg:#0E0F12;--fg:#F2F2EE;--ac:#E4572E;--ai:#fff;--sf:#191B21;--cd:#14161B;--ln:#2A2D36;--mu:#9A9DA8;--hf:'Oswald','Arial Narrow',sans-serif;--bf:'Onest',system-ui,sans-serif;--hw:600;--ht:.01em;--r:6px}
h1,h2{text-transform:uppercase}
.cv{display:block;border-radius:8px;background:radial-gradient(ellipse at 50% 100%,#2b2e38 0,#191B21 62%);padding:18px 10px 8px}
.cv svg{display:block;width:100%;height:auto}
.stage{padding:8% 4% 4%;border-radius:14px;background:radial-gradient(ellipse at 50% 96%,#383c49 0,#191B21 58%,#0E0F12 100%)}
.heart{flex:none;display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--ln);border-radius:50%;background:none;color:var(--mu);cursor:pointer}
.heart svg{width:18px;height:18px}
.heart[aria-pressed=true]{color:var(--ac);border-color:var(--ac)}
.heart[aria-pressed=true] path{fill:currentColor}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--ln);cursor:pointer;padding:0}
.sw[aria-pressed=true]{outline:2px solid var(--ac);outline-offset:3px}
.filters{display:grid;gap:18px;padding:20px;border:1px solid var(--ln);border-radius:12px;background:var(--cd);margin-bottom:24px}
.filters .row{gap:8px 14px}
.filters small{color:var(--mu);min-width:74px}
.cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;margin-left:6px;padding:0 6px;border-radius:10px;background:var(--ac);color:#fff;font-size:.75rem}
.sp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.sp div{display:grid;gap:2px;padding:14px;background:var(--cd)}
.sp small{color:var(--mu)}
</style>
</head>
<body>
<script src="kit.js"></script>
<script>
(function () {
  'use strict';
  var K = Kit, L = K.L, s = K.s, e = K.esc;
  var RATE = 19.9;

  var S = {

    fav: ['Избранное', 'Таңдаулылар', 'Favourites'],

    hp: ['Кредит от 12 месяцев, трейд-ин и тест-драйв в день обращения.', '12 айдан бастап несие, трейд-ин және өтініш берген күні тест-драйв.', 'Financing from 12 months, trade-in and a same-day test drive.'],
    toCat: ['Смотреть каталог', 'Каталогты көру', 'Browse catalogue'],
    td: ['Записаться на тест-драйв', 'Тест-драйвқа жазылу', 'Book a test drive'],
    pop: ['Популярные модели', 'Танымал модельдер', 'Popular models'],
    why: ['Почему покупают у нас', 'Неге бізден алады', 'Why buy from us'],
    a1: ['Официальная гарантия', 'Ресми кепілдік', 'Official warranty'], a1d: ['5 лет или 150 000 км на каждый автомобиль.', 'Әр автокөлікке 5 жыл немесе 150 000 км.', '5 years or 150,000 km on every car.'],
    a2: ['Кредит за один визит', 'Бір келгенде несие', 'Financing in one visit'], a2d: ['Работаем с несколькими банками, решение в день обращения.', 'Бірнеше банкпен жұмыс істейміз, шешім сол күні шығады.', 'We work with several banks; a decision the same day.'],
    a3: ['Трейд-ин', 'Трейд-ин', 'Trade-in'], a3d: ['Примем ваш автомобиль в счёт нового.', 'Көлігіңізді жаңасының есебіне қабылдаймыз.', 'We take your current car as part of the payment.'],
    a4: ['Свой сервис', 'Өз сервисіміз', 'In-house service'], a4d: ['Техобслуживание и запчасти в одном месте.', 'Техникалық қызмет пен қосалқы бөлшектер бір жерде.', 'Maintenance and parts in one place.'],
    body: ['Кузов', 'Шанақ', 'Body'], fuel: ['Топливо', 'Отын', 'Fuel'],
    maxp: ['Цена до', 'Ең жоғары баға', 'Price up to'], stock: ['Только в наличии', 'Тек қолда бары', 'In stock only'],
    sort: ['Сортировка', 'Сұрыптау', 'Sort by'], pa: ['Сначала дешевле', 'Алдымен арзаны', 'Price: low to high'], pd: ['Сначала дороже', 'Алдымен қымбаты', 'Price: high to low'], hpS: ['По мощности', 'Қуаты бойынша', 'By power'],
    found: ['Найдено: {n}', 'Табылды: {n}', 'Found: {n}'], none: ['Под эти условия ничего нет. Измените фильтры.', 'Бұл шарттарға сай көлік жоқ. Сүзгілерді өзгертіңіз.', 'Nothing matches. Try changing the filters.'], reset: ['Сбросить фильтры', 'Сүзгілерді тазарту', 'Reset filters'],
    inSt: ['В наличии', 'Қолда бар', 'In stock'], ord: ['Под заказ', 'Тапсырыспен', 'To order'], hpU: ['л.с.', 'а.к.', 'hp'], mln: ['млн ₸', 'млн ₸', 'M ₸'],
    specs: ['Характеристики', 'Сипаттамалары', 'Specifications'], eng: ['Двигатель', 'Қозғалтқыш', 'Engine'], power: ['Мощность', 'Қуаты', 'Power'], drive: ['Привод', 'Жетек', 'Drivetrain'],
    cons: ['Расход', 'Отын шығыны', 'Consumption'], consU: ['л на 100 км', 'л / 100 км', 'l per 100 km'], rng: ['Запас хода', 'Жүріс қоры', 'Range'], km: ['км', 'км', 'km'],
    color: ['Цвет', 'Түсі', 'Colour'], trim: ['Комплектация', 'Жинақтама', 'Trim'],
    t0: ['Базовое оснащение', 'Базалық жабдықталуы', 'Core equipment'], t1: ['Подогрев сидений, камера, диски 18"', 'Орындық жылытқышы, камера, 18" дискілер', 'Heated seats, camera, 18" wheels'], t2: ['Кожа, панорамная крыша, ассистенты водителя', 'Былғары, панорамалық төбе, жүргізуші көмекшілері', 'Leather, panoramic roof, driver assists'],
    price: ['Цена', 'Бағасы', 'Price'], perMo: ['{p} ₸ в месяц', 'айына {p} ₸', '{p} ₸ per month'], inCr: ['В кредит: {p}', 'Несиеге: {p}', 'On finance: {p}'],

    favOn: ['Добавлено в избранное', 'Таңдаулыға қосылды', 'Added to favourites'], favOff: ['Убрано из избранного', 'Таңдаулыдан алынды', 'Removed from favourites'],

    tiCar: ['Марка и модель', 'Маркасы мен моделі', 'Make and model'], tiY: ['Год выпуска', 'Шыққан жылы', 'Year'], tiKm: ['Пробег, км', 'Жүрісі, км', 'Mileage, km'], tiBtn: ['Получить оценку', 'Бағасын білу', 'Get a valuation'],

    cT: ['Приезжайте на тест-драйв', 'Тест-драйвқа келіңіз', 'Come for a test drive'], cD: ['Оставьте заявку, менеджер перезвонит и согласует время.', 'Өтінім қалдырыңыз, менеджер қоңырау шалып, уақытты келіседі.', 'Leave a request and a manager will call to arrange a time.'],
    salon: ['Автосалон', 'Автосалон', 'Showroom']

  var DRIVE = { FWD: ['Передний', 'Алдыңғы', 'Front-wheel'], AWD: ['Полный', 'Толық', 'All-wheel'], RWD: ['Задний', 'Артқы', 'Rear-wheel'] };

    { id: 'altai-s', n: 'Altai S', b: 'sedan', p: 8900000, f: 'p', hp: 150, eng: '1.5T', dr: 'FWD', cons: 6.4, st: 1 },
    { id: 'altai-h', n: 'Altai S Hybrid', b: 'sedan', p: 11400000, f: 'h', hp: 184, eng: '1.5 HEV', dr: 'FWD', cons: 4.6, st: 1 },
    { id: 'arlan-gt', n: 'Arlan GT', b: 'sedan', p: 16800000, f: 'p', hp: 261, eng: '2.0T', dr: 'AWD', cons: 8.1, st: 0 },
    { id: 'tengri-x', n: 'Tengri X', b: 'suv', p: 12500000, f: 'p', hp: 170, eng: '1.5T', dr: 'AWD', cons: 7.4, st: 1 },
    { id: 'tengri-x7', n: 'Tengri X7', b: 'suv', p: 18900000, f: 'h', hp: 245, eng: '2.0 HEV', dr: 'AWD', cons: 5.9, st: 1 },
    { id: 'saryarka', n: 'Saryarka 9', b: 'suv', p: 24500000, f: 'p', hp: 299, eng: '3.0T', dr: 'AWD', cons: 10.2, st: 0 },
    { id: 'sunkar', n: 'Sunkar', b: 'hatch', p: 6900000, f: 'p', hp: 113, eng: '1.5', dr: 'FWD', cons: 5.9, st: 1 },
    { id: 'sunkar-x', n: 'Sunkar Cross', b: 'hatch', p: 8200000, f: 'p', hp: 122, eng: '1.6', dr: 'FWD', cons: 6.3, st: 1 },
    { id: 'zhuldyz-e', n: 'Zhuldyz E', b: 'hatch', p: 13900000, f: 'e', hp: 204, eng: '60 kWh', dr: 'RWD', rng: 430, st: 1 }
  ];
  var SHAPE = {
    sedan: ['M10 56Q12 43 30 41L58 39Q72 23 100 23L128 23Q150 24 166 39L186 44Q194 47 194 56L194 61L10 61Z', 'M64 39Q76 28 100 28L112 28L112 39Z', 'M116 28L128 28Q144 29 156 39L116 39Z', 50, 156],
    suv: ['M10 57Q10 41 24 39L46 37Q58 17 84 17L150 17Q168 18 178 37L188 41Q194 44 194 55L194 61L10 61Z', 'M52 37Q62 23 84 23L104 23L104 37Z', 'M108 23L146 23Q160 24 168 37L108 37Z', 48, 158],
    hatch: ['M12 57Q13 44 30 42L56 40Q70 23 96 23L140 23Q160 25 176 41L186 45Q192 48 192 56L192 61L12 61Z', 'M62 40Q74 28 96 28L110 28L110 40Z', 'M114 28L138 28Q152 30 164 40L114 40Z', 50, 154]
  };
  var HEART = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.600-7 10-7 10Z"/></svg>';

  var st = { b: 'all', f: 'all', max: 25, stock: false, sort: 'pa' };
  var view = { color: 0, trim: 0 }, cr = { car: 'tengri-x', down: 20, term: 60 };
  function favs() { return K.store.get('autoFav', []); }
  function byId(id) { for (var i = 0; i < CARS.length; i++) if (CARS[i].id === id) return CARS[i]; return CARS[0]; }
  function pay(p, down, n) { var P = p * (1 - down / 100), r = RATE / 1200; return P * r / (1 - Math.pow(1 + r, -n)); }
  function svg(b, color) {

  }
  function meta(c) { return L(BODY[c.b]) + ', ' + c.eng + ', ' + c.hp + ' ' + s('hpU'); }
  function card(c, i) {
    var on = favs().indexOf(c.id) > -1;
    return '<article class="card"><a class="cv" href="#/car/' + c.id + '" aria-label="' + e(c.n) + '">' + svg(c.b, COL[(i || 0) % COL.length]) + '</a>' +

  }

  }

  var routes = {
    home: function () {
      var top = ['tengri-x', 'altai-h', 'zhuldyz-e'].map(byId);

        '<section><div class="wrap"><div class="hd"><h2>' + e(s('pop')) + '</h2></div><div class="g">' + top.map(function (c) { return card(c, CARS.indexOf(c)); }).join('') + '</div></div></section>' +

        '<section><div class="wrap g2"><div class="hd"><h2>' + e(s('cH')) + '</h2><p class="lead">' + e(s('rateN')) + '</p><div><a class="btn" href="#/credit">' + e(s('credit')) + '</a></div></div><div class="box" id="crOut">' + crOut() + '</div></div></section>';

      var c = byId(id), p = c.p + TRIMS[view.trim][1], on = favs().indexOf(c.id) > -1;
      return '<section class="pg"><div class="wrap"><div class="crumbs"><a href="#/catalog">' + e(s('catalog')) + '</a><span>/</span><span>' + e(c.n) + '</span></div><div class="g2">' +
        '<div style="display:grid;gap:18px"><div class="stage" id="carPic">' + svg(c.b, COL[view.color]) + '</div><div class="row"><span class="mu sm">' + e(s('color')) + '</span>' + COL.map(function (h, i) { return '<button class="sw" type="button" data-color="' + i + '" aria-pressed="' + (i === view.color) + '" style="background:' + h + '" aria-label="' + e(s('color')) + ' ' + (i + 1) + '"></button>'; }).join('') + '</div>' +
        '<h2>' + e(s('specs')) + '</h2><div class="sp"><div><small>' + e(s('body')) + '</small><b>' + e(L(BODY[c.b])) + '</b></div><div><small>' + e(s('eng')) + '</small><b>' + e(c.eng) + ', ' + e(L(FUEL[c.f])) + '</b></div><div><small>' + e(s('power')) + '</small><b>' + c.hp + ' ' + e(s('hpU')) + '</b></div><div><small>' + e(s('drive')) + '</small><b>' + e(L(DRIVE[c.dr])) + '</b></div><div><small>' + e(s(c.rng ? 'rng' : 'cons')) + '</small><b>' + (c.rng ? c.rng + ' ' + e(s('km')) : String(c.cons).replace('.', K.lang() === 'en' ? '.' : ',') + ' ' + e(s('consU'))) + '</b></div></div></div>' +
        '<div class="box sticky"><div class="row" style="justify-content:space-between"><h1 style="font-size:clamp(1.8rem,4vw,2.6rem)">' + e(c.n) + '</h1><span class="tag' + (c.st ? ' on' : '') + '">' + e(s(c.st ? 'inSt' : 'ord')) + '</span></div>' +
        '<fieldset class="f"><legend class="mu sm" style="margin-bottom:8px">' + e(s('trim')) + '</legend>' + TRIMS.map(function (t, i) { return '<label class="opt"><input type="radio" name="trim" value="' + i + '"' + (i === view.trim ? ' checked' : '') + '><span><b>' + t[0] + (t[1] ? ', + ' + K.tg(t[1]) : '') + '</b><span class="mu sm">' + e(s(t[2])) + '</span></span></label>'; }).join('') + '</fieldset>' +
        '<div><p class="mu sm">' + e(s('price')) + '</p><p class="big num">' + K.tg(p) + '</p><p class="mu sm">' + s('inCr', { p: s('perMo', { p: K.money(pay(p, 20, 60)) }) }) + ' (' + e(s('crHint')) + ')</p></div>' +
        '<div class="row"><button class="btn" type="button" data-scroll="tdf">' + e(s('td')) + '</button><button class="btn gh" type="button" data-fav="' + c.id + '" aria-pressed="' + on + '">' + e(s(on ? 'inFav' : 'addFav')) + '</button></div></div></div>' +
        '<div class="box" id="tdf" style="margin-top:32px;scroll-margin-top:110px"><h2>' + e(s('td')) + '</h2>' + tdForm(c.id) + '</div></div></section>';
    },
    credit: function () {
      return '<section class="pg"><div class="wrap"><div class="hd"><h1>' + e(s('credit')) + '</h1></div><div class="g2"><div class="box"><h2>' + e(s('cH')) + '</h2>' +
        K.fl(s('model'), '<select id="crCar">' + CARS.map(function (c) { return '<option value="' + c.id + '"' + (c.id === cr.car ? ' selected' : '') + '>' + e(c.n) + ', ' + K.tg(c.p) + '</option>'; }).join('') + '</select>') +
        '<label class="fl"><span>' + e(s('down')) + ': <b id="downOut">' + cr.down + '%</b></span><input type="range" id="crDown" min="10" max="70" step="5" value="' + cr.down + '"></label>' +
        '<label class="fl"><span>' + e(s('term')) + ': <b id="termOut">' + cr.term + ' ' + e(s('mo')) + '</b></span><input type="range" id="crTerm" min="12" max="84" step="12" value="' + cr.term + '"></label></div>' +
        '<div class="box" id="crOut">' + crOut() + '</div></div>' +
        '<div class="g2" style="margin-top:32px"><div class="box"><h2>' + e(s('apply')) + '</h2>' + K.form('credit', '<input type="hidden" name="calc" id="crHid" data-l="' + e(s('cH')) + '">' + K.np(), s('apply')) + '</div>' +
        '<div class="box"><h2>' + e(s('tiH')) + '</h2><p class="mu">' + e(s('tiD')) + '</p>' + K.form('tradein', K.fl(s('tiCar'), '<input name="car" required>') + '<div class="f2">' + K.fl(s('tiY'), '<input name="year" type="number" min="1995" max="2026" placeholder="2018">') + K.fl(s('tiKm'), '<input name="km" type="number" min="0" step="1000" placeholder="90000">') + '</div>' + K.np(), s('tiBtn')) + '</div></div></div></section>';
    },
    fav: function () {
      var a = CARS.filter(function (c) { return favs().indexOf(c.id) > -1; });
      return '<section class="pg"><div class="wrap"><div class="hd"><h1>' + e(s('fav')) + '</h1></div>' + (a.length ? '<div class="g">' + a.map(function (c) { return card(c, CARS.indexOf(c)); }).join('') + '</div>' : '<div class="box"><p>' + e(s('favE')) + '</p><div><a class="btn" href="#/catalog">' + e(s('toCat')) + '</a></div></div>') + '</div></section>';
    },
    contacts: function () {
      return '<section class="pg"><div class="wrap g2"><div class="hd"><h1>' + e(s('cT')) + '</h1><p class="lead">' + e(s('cD')) + '</p><div class="list"><div><span>' + e(s('salon')) + '</span><i></i><b>' + e(s('addr')) + '</b></div><div><span>' + e(s('phone')) + '</span><i></i><b>+7 (700) 000-00-00</b></div><div><span>' + e(s('time')) + '</span><i></i><b>' + e(s('hours')) + '</b></div></div></div><div class="box">' + tdForm('tengri-x') + '</div></div></section>';
    }
  };

  function syncCr() {
    var o = K.q('#crOut'); if (o) o.innerHTML = crOut();
    var h = K.q('#crHid'), c = byId(cr.car);
    if (h) h.value = c.n + ', ' + cr.down + '%, ' + cr.term + ' ' + s('mo') + ', ' + s('perMo', { p: K.money(pay(c.p, cr.down, cr.term)) });
  }
  document.addEventListener('click', function (ev) {
    var t = ev.target, b;
    if ((b = t.closest('[data-fav]'))) {
      var id = b.getAttribute('data-fav'), f = favs(), i = f.indexOf(id);
      if (i > -1) f.splice(i, 1); else f.push(id);
      K.store.set('autoFav', f); K.toast(s(i > -1 ? 'favOff' : 'favOn')); K.refresh(); return;
    }
    if ((b = t.closest('[data-flt]'))) { st[b.getAttribute('data-flt')] = b.getAttribute('data-v'); K.refresh(); return; }
    if (t.closest('[data-reset]')) { st = { b: 'all', f: 'all', max: 25, stock: false, sort: 'pa' }; K.refresh(); return; }
    if ((b = t.closest('[data-color]'))) { view.color = +b.getAttribute('data-color'); K.refresh(); }
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'maxp') { st.max = +t.value; K.q('#maxOut').textContent = st.max + ' ' + s('mln'); K.q('#list').innerHTML = listHtml(); }
    else if (t.id === 'crDown') { cr.down = +t.value; K.q('#downOut').textContent = cr.down + '%'; syncCr(); }
    else if (t.id === 'crTerm') { cr.term = +t.value; K.q('#termOut').textContent = cr.term + ' ' + s('mo'); syncCr(); }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'sort') { st.sort = t.value; K.q('#list').innerHTML = listHtml(); }
    else if (t.id === 'stock') { st.stock = t.checked; K.q('#list').innerHTML = listHtml(); }
    else if (t.name === 'trim') { view.trim = +t.value; K.refresh(); }
    else if (t.id === 'crCar') { cr.car = t.value; syncCr(); }
  });

  K.init({
    brand: 'Demo <i>Auto</i>', niche: ['автосалона', 'автосалонға', 'a car dealership'], S: S,
    nav: [['catalog', 'catalog'], ['credit', 'credit'], ['fav', 'fav', function () { var n = favs().length; return n ? '<span class="cnt">' + n + '</span>' : ''; }], ['contacts', 'contacts']],
    cta: ['contacts', 'td'], routes: routes,
    after: function (name) { if (name === 'credit') syncCr(); if (name !== 'car') { view.color = 0; view.trim = 0; } }
  });
})();
</script>
</body>
</html>
