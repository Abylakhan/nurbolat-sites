<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Demo Cargo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="kit.css">
<style>
/* Карго: тёмно-синий «диспетчерский» стиль, жёлтый акцент, номера и цифры моноширинно */
:root{color-scheme:dark;--bg:#0C1826;--fg:#EAF1F7;--ac:#F2C230;--ai:#17130A;--sf:#12233A;--cd:#132740;--ln:#25405E;--mu:#9BB2C8;--hf:'IBM Plex Sans',system-ui,sans-serif;--bf:'IBM Plex Sans',system-ui,sans-serif;--hw:600;--ht:-.02em;--r:8px}
.trk{display:flex;gap:10px;flex-wrap:wrap}
.trk input{flex:1 1 220px;text-transform:uppercase;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.trk input::placeholder{text-transform:none;letter-spacing:0}
.mth{position:relative}
.mth[aria-pressed=true]{border-color:var(--ac)}
.tl{display:grid;gap:0;margin:8px 0}
.tl li{position:relative;display:grid;gap:2px;padding:0 0 22px 34px}
.tl li::before{content:"";position:absolute;left:5px;top:4px;width:14px;height:14px;border-radius:50%;border:2px solid var(--ln);background:var(--bg)}
.tl li::after{content:"";position:absolute;left:11px;top:22px;bottom:0;border-left:2px solid var(--ln)}
.tl li:last-child::after{display:none}
.tl li.done::before{background:var(--ac);border-color:var(--ac)}
.tl li.done::after{border-color:var(--ac)}
.tl li.now::before{border-color:var(--ac);box-shadow:0 0 0 5px color-mix(in srgb,var(--ac) 25%,transparent)}
.tl li:not(.done):not(.now){color:var(--mu)}
.prog{height:8px;border-radius:4px;background:var(--sf);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ac)}
</style>
</head>
<body>
<script src="kit.js"></script>
<script>
(function () {

    w4: ['Таможня', 'Кеден', 'Customs'], w4d: ['Оформляем документы и проходим границу.', 'Құжаттарды рәсімдеп, шекарадан өтеміз.', 'We handle the paperwork and cross the border.'],

    method: ['Способ', 'Тәсіл', 'Method'], time: ['Срок', 'Мерзімі', 'Transit time'], w0: ['до 100 кг', '100 кг-ға дейін', 'up to 100 kg'], w100: ['100–500 кг', '100–500 кг', '100–500 kg'], w500: ['от 500 кг', '500 кг-нан бастап', 'over 500 kg'],

        '<section><div class="wrap g2"><ul class="ck">' + [1, 2, 3].map(function (i) { return '<li><b>' + e(s('a' + i)) + '</b></li>'; }).join('') + '</ul>' + K.ph('1601467995997-ac1ae9a8fff4', '16/9', s('w3')) + '</div></section>';
    },
    tariffs: function () {
      return '<section class="pg"><div class="wrap"><div class="hd"><h1>' + e(s('tariffs')) + '</h1><p class="lead">' + e(s('tN')) + '</p></div><div class="tw"><table><thead><tr><th>' + e(s('method')) + '</th><th>' + e(s('time')) + '</th><th>' + e(s('w0')) + '</th><th>' + e(s('w100')) + '</th><th>' + e(s('w500')) + '</th></tr></thead><tbody>' +
        M.map(function (m) { return '<tr><td><b>' + e(s(m[0])) + '</b><br><span class="mu sm">' + e(s(m[0] + 'D')) + '</span></td><td class="num">' + s('dd', { a: m[2], b: m[3] }) + '</td>' + [1, .92, .85].map(function (k) { return '<td class="num">' + s('perKg', { p: K.money(m[1] * k) }) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>' +
        '<h2 style="margin:36px 0 16px">' + e(s('xT')) + '</h2><div class="list">' + ['ins', 'pack', 'door'].map(function (k) { return '<div><span>' + e(s(k)) + '</span><i></i><b>' + e(s(k + 'D')) + '</b></div>'; }).join('') + '</div><p style="margin-top:28px"><a class="btn" href="#/calc">' + e(s('quote')) + '</a></p></div></section>';
    },

      return '<section class="pg"><div class="wrap"><div class="hd"><h1>' + e(s('calc')) + '</h1></div><div class="g2"><div class="f"><div class="f2">' + K.fl(s('fromC'), sel('cf', FROM, c.f)) + K.fl(s('toC'), sel('ct', TO, c.t)) + '</div><div class="f2">' + K.fl(s('weight'), '<input id="cw" type="number" min="1" max="20000" step="1" value="' + c.w + '">') + K.fl(s('vol'), '<input id="cv" type="number" min="0.01" max="120" step="0.01" value="' + c.v + '">') + '</div>' +

    },
    contacts: function () {
      return '<section class="pg"><div class="wrap g2"><div class="hd"><h1>' + e(s('cT')) + '</h1><p class="lead">' + e(s('cD')) + '</p><h3>' + e(s('wh')) + '</h3><div class="list">' + FROM.concat(TO).map(function (x) { return '<div><span>' + e(L(x[0])) + '</span><i></i><b class="mu">' + e(s('whN')) + '</b></div>'; }).join('') + '<div><span>' + e(s('phone')) + '</span><i></i><b>+7 (700) 000-00-00</b></div></div></div><div class="box">' + K.form('contact', K.fl(s('what'), '<input name="goods">') + K.np() + K.fl(s('comment'), '<input name="comment">')) + '</div></div></section>';
    }
  };

  function upd() { var q = K.q('#q'); if (q) q.innerHTML = qHtml(); var h = K.q('#qHid'); if (h) h.value = sumText(); }
  document.addEventListener('click', function (ev) {
    var x;
    if ((x = ev.target.closest('[data-m]'))) { c.m = x.getAttribute('data-m'); upd(); }
    else if ((x = ev.target.closest('[data-pm]'))) c.m = x.getAttribute('data-pm');
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target, v = parseFloat(t.value);
    if (t.id === 'cw' && v > 0) { c.w = v; upd(); } else if (t.id === 'cv' && v > 0) { c.v = v; upd(); } else if (t.id === 'cval' && v >= 0) { c.val = v; upd(); }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'cf') { c.f = +t.value; upd(); } else if (t.id === 'ct') { c.t = +t.value; upd(); } else if (t.name === 'x') { c[t.value] = t.checked; upd(); }
  });
  document.addEventListener('submit', function (ev) {
    if (ev.target.id !== 'trk') return;
    ev.preventDefault();
    var v = K.q('#trkN').value.trim().toUpperCase();
    if (location.hash === '#/track/' + v) K.refresh(); else K.go('track/' + encodeURIComponent(v || '-'));
  });

  K.init({
    brand: 'Demo<i>Cargo</i>', niche: ['карго и доставки', 'карго және жеткізу қызметіне', 'a cargo and delivery company'], S: S,
    nav: [['tariffs', 'tariffs'], ['calc', 'calc'], ['track', 'track'], ['contacts', 'contacts']], cta: ['calc', 'quote'], routes: routes
  });
})();
</script>
