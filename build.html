.pcard{padding:0;overflow:hidden}
.pcard .ph{border-radius:0}
.pcard>div:last-child{display:grid;gap:8px;padding:18px}
.total{display:grid;gap:4px;padding:18px;border-radius:6px;background:var(--fg);color:var(--bg)}
.total .mu{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.nmb{width:110px!important;min-height:40px!important}

        '<label class="fl"><span>' + e(s('area')) + ': <b id="aOut">' + c.a + ' ' + s('sq') + '</b></span><input type="range" id="area" min="20" max="250" step="1" value="' + c.a + '"></label>' +
        '<fieldset class="f"><legend class="mu sm" style="margin-bottom:8px">' + e(s('type')) + '</legend>' + TYPES.map(function (t, i) { return '<label class="opt"><input type="radio" name="ct" value="' + i + '"' + (i === c.t ? ' checked' : '') + '><span><b>' + e(s(t[0])) + ', ' + s('perM', { p: K.money(t[1]) }) + '</b><span class="mu sm">' + e(s(t[0] + 'd')) + '</span></span></label>'; }).join('') + '</fieldset>' +
        K.fl(s('mat'), '<select id="mat">' + MATS.map(function (m, i) { return '<option value="' + i + '"' + (i === c.m ? ' selected' : '') + '>' + e(s(m[0])) + (m[1] ? ', ' + s('perM', { p: K.money(m[1]) }) : '') + '</option>'; }).join('') + '</select>') +
        K.fl(s('baths'), '<select id="baths">' + [0, 1, 2, 3].map(function (n) { return '<option' + (n === c.b ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select>') +
        '<fieldset class="f"><legend class="mu sm" style="margin-bottom:8px">' + e(s('extra')) + '</legend>' + OPTS.map(function (o) { return '<label class="opt"><input type="checkbox" name="co" value="' + o[0] + '"' + (c.o[o[0]] ? ' checked' : '') + '><span><b>' + e(s(o[0])) + '</b><span class="mu sm">' + (o[2] ? s('perM', { p: K.money(o[1]) }) : K.tg(o[1])) + '</span></span></label>'; }).join('') + '</fieldset></div>' +
        '<div class="box sticky"><div id="out" style="display:grid;gap:16px">' + calcOut() + '</div><a class="btn" href="#/contacts">' + e(s('getEst')) + '</a></div></div></div></section>';
    },
    projects: function () {
      return '<section class="pg"><div class="wrap"><div class="hd"><h1>' + e(s('projects')) + '</h1></div><div class="chips" style="margin-bottom:24px">' + [['all', s('allF')], ['flat', s('flat')], ['house', s('house')], ['room', s('room')]].map(function (o) { return '<button class="chip" type="button" data-pk="' + o[0] + '" aria-pressed="' + (st.pk === o[0]) + '">' + e(o[1]) + '</button>'; }).join('') + '</div><div class="g" style="--min:300px">' + plist() + '</div></div></section>';
    },
    project: function (id) {
      var p = PRJ.filter(function (x) { return x.id === id; })[0] || PRJ[0];
      return '<section class="pg"><div class="wrap"><div class="crumbs"><a href="#/projects">' + e(s('projects')) + '</a><span>/</span><span>' + e(L(p.n)) + '</span></div><div class="g2">' + K.ph(p.img, '4/3', L(p.n)) + '<div class="f"><span><span class="tag">' + e(s(p.k)) + '</span></span><h1 style="font-size:clamp(1.6rem,3.6vw,2.4rem)">' + e(L(p.n)) + '</h1><div class="list"><div><span>' + e(s('area')) + '</span><i></i><b>' + p.a + ' ' + s('sq') + '</b></div><div><span>' + e(s('termL')) + '</span><i></i><b>' + s('days', { n: p.d }) + '</b></div><div><span>' + e(s('budget')) + '</span><i></i><b>' + K.tg(p.b) + '</b></div></div><h3>' + e(s('done')) + '</h3><ul class="ck">' + p.w.map(function (k) { return '<li>' + e(s(k)) + (S[k + 'd'] ? '<span class="mu sm">: ' + e(s(k + 'd')).toLowerCase() + '</span>' : '') + '</li>'; }).join('') + '</ul><div><a class="btn" href="#/contacts">' + e(s('same')) + '</a></div></div></div></div></section>';
    },
    contacts: function () {
      var r = calc();
      return '<section class="pg"><div class="wrap g2"><div class="hd"><h1>' + e(s('cT')) + '</h1><p class="lead">' + e(s('cD')) + '</p><div class="list"><div><span>' + e(s('office')) + '</span><i></i><b>' + e(s('addr')) + '</b></div><div><span>' + e(s('phone')) + '</span><i></i><b>+7 (700) 000-00-00</b></div><div><span>' + e(s('time')) + '</span><i></i><b>' + e(s('hours')) + '</b></div></div>' + K.ph('1674649207083-281c2517ab49', '16/9', s('how')) + '</div><div class="box">' + visitForm(c.a + ' ' + s('sq') + ', ' + s(TYPES[c.t][0]) + ', ' + K.tg(r.total).replace(/ /g, ' ')) + '</div></div></section>';
    }
  };

  function upd() { var o = K.q('#out'); if (o) o.innerHTML = calcOut(); }
  document.addEventListener('click', function (ev) {
    var b;
    if ((b = ev.target.closest('[data-cat]'))) { st.cat = b.getAttribute('data-cat'); if (b.tagName === 'BUTTON') K.refresh(); return; }
    if ((b = ev.target.closest('[data-pk]'))) { st.pk = b.getAttribute('data-pk'); K.refresh(); }
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'area') { c.a = +t.value; K.q('#aOut').textContent = c.a + ' ' + s('sq'); upd(); }
    else if (t.id === 'q') { st.q = t.value; K.q('#rows').innerHTML = rows(); }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.name === 'ct') { c.t = +t.value; upd(); }
    else if (t.id === 'mat') { c.m = +t.value; upd(); }
    else if (t.id === 'baths') { c.b = +t.value; upd(); }
    else if (t.name === 'co') { c.o[t.value] = t.checked; upd(); }
  });

  K.init({
    brand: 'Demo<i>Build</i>', niche: ['компании по ремонту и строительству', 'жөндеу және құрылыс компаниясына', 'a renovation and construction company'], S: S,
    nav: [['services', 'services'], ['calc', 'calc'], ['projects', 'projects'], ['contacts', 'contacts']], cta: ['contacts', 'visit'], routes: routes
  });
})();
</script>
</body>
</html>
